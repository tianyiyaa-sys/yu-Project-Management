<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目中心 - 雨诺项目工作台</title>
<style>
:root{--bg:#f7f8fa;--panel:#fff;--line:#e9ebef;--text:#17191d;--muted:#777d87;--muted2:#9aa0aa;--accent:#4b6bfb;--soft:#eef2ff;--success:#2e9b73;--warning:#d79a2b;--danger:#d85b5b;--shadow:0 10px 30px rgba(31,35,41,.055);--radius:18px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#fafafa 0%,#f5f6f8 100%);color:var(--text)}
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}.sidebar{background:rgba(250,250,250,.92);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px 26px}.brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#5c76ff,#7f93ff);color:white;font-weight:800;box-shadow:0 8px 20px rgba(75,107,251,.22)}
.brand-text strong{display:block;font-size:14px}.brand-text span{display:block;color:var(--muted2);font-size:11px;margin-top:2px}.nav-title{padding:0 12px 8px;color:#a4a9b2;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;color:#5d636d;text-decoration:none;padding:10px 12px;border-radius:11px;margin:3px 0;font-size:13px;font-weight:550}.nav a:hover{background:#f0f1f3;color:#24272c}.nav a.active{background:#fff;color:#1f2430;box-shadow:0 6px 16px rgba(31,35,41,.05);border:1px solid #eceef2}.nav-icon{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:#f0f2f5;color:#7d8490;font-size:12px}.nav a.active .nav-icon{background:var(--soft);color:var(--accent)}
main{padding:28px 32px 44px;min-width:0}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.eyebrow{color:#9a9fa8;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}h1{font-size:28px;margin:0;letter-spacing:-.03em}.subtitle{color:var(--muted);font-size:13px;margin-top:8px}
.actions{display:flex;gap:9px;align-items:center}.btn{appearance:none;border:1px solid var(--line);background:#fff;color:#353942;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:650;text-decoration:none;cursor:pointer}.btn.primary{background:var(--text);color:white;border-color:var(--text);box-shadow:0 6px 16px rgba(23,25,29,.14)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.panel-title{font-size:14px;font-weight:750}.panel-sub{font-size:11px;color:var(--muted2);margin-top:4px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.search{flex:1;min-width:240px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:12px}.select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:12px;color:#555d68}
table{width:100%;border-collapse:collapse;min-width:860px}th{text-align:left;padding:10px 8px;font-size:10px;color:#9ba1aa;font-weight:700;border-bottom:1px solid var(--line)}td{padding:14px 8px;border-bottom:1px solid #f0f1f3;font-size:12px;color:#4f5560}.empty{padding:44px 12px;text-align:center;color:#9ba1aa;font-size:12px}.empty strong{display:block;color:#4d535c;font-size:14px;margin-bottom:8px}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#f2f3f5;color:#747b85;font-size:10px}
.detail-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.stack{display:grid;gap:16px}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;margin-bottom:16px}.summary{padding:18px;border-right:1px solid var(--line)}.summary:last-child{border-right:none}.summary span{display:block;color:var(--muted);font-size:11px}.summary strong{display:block;font-size:20px;margin-top:10px}.tabs{display:flex;gap:6px;margin:14px 0 18px;overflow:auto}.tab{padding:8px 11px;border-radius:9px;text-decoration:none;color:#6a717c;font-size:12px;white-space:nowrap}.tab.active{background:#fff;border:1px solid var(--line);color:#20242b;box-shadow:0 4px 12px rgba(31,35,41,.04)}.list{display:grid;gap:10px}.item{padding:13px 14px;background:#fbfbfc;border:1px solid #eef0f2;border-radius:13px}.item strong{font-size:12px}.item span{display:block;color:var(--muted);font-size:11px;line-height:1.55;margin-top:5px}.back{display:inline-flex;margin-bottom:16px;color:#6d7480;text-decoration:none;font-size:12px}
@media(max-width:1000px){.detail-grid{grid-template-columns:1fr}.summary-grid{grid-template-columns:repeat(2,1fr)}.summary:nth-child(2){border-right:none}.summary:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}.nav{display:flex;gap:4px;overflow:auto}.nav-title{display:none}.nav a{white-space:nowrap}main{padding:20px}}
</style></head>
<body><div class="app">
<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">Y</div>
    <div class="brand-text"><strong>雨诺项目工作台</strong><span>PMO Operating Console</span></div>
  </div>
  <div class="nav-title">Workspace</div>
  <nav class="nav">
    <a  href="index.html"><span class="nav-icon">⌂</span>PMO 首页</a>
    <a class="active" href="projects.html"><span class="nav-icon">项</span>项目中心</a>
    <a href="#"><span class="nav-icon">险</span>风险中心</a>
    <a href="#"><span class="nav-icon">资</span>资产中心</a>
    <a href="#"><span class="nav-icon">析</span>分析中心</a>
    <a href="#"><span class="nav-icon">AI</span>小雨助手</a>
  </nav>
</aside>
<main>
  <div class="topbar">
    <div><div class="eyebrow">Project Center</div><h1>项目中心</h1><div class="subtitle">统一查看项目状态、阶段、进度、风险、投入与回款。</div></div>
    <div class="actions"><a class="btn" href="http://localhost:3000" target="_blank">打开 Wekan</a><a class="btn primary" href="project.html">查看单项目结构</a></div>
  </div>

  <section class="panel">
    <div class="panel-title">全部项目</div>
    <div class="panel-sub">项目清单将从 Wekan 自动同步，经营字段由 RBC 补充。</div>
    <div class="toolbar">
      <input class="search" placeholder="搜索项目名称 / 项目经理 / 客户">
      <select class="select"><option>全部状态</option><option>执行中</option><option>已暂停</option><option>已结束</option></select>
      <select class="select"><option>全部阶段</option><option>待启动</option><option>实施中</option><option>验收中</option></select>
      <select class="select"><option>全部风险</option><option>高风险</option><option>中风险</option><option>低风险</option></select>
    </div>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>项目</th><th>客户</th><th>项目经理</th><th>当前阶段</th><th>计划进度</th><th>实际进度</th><th>投入</th><th>回款</th><th>风险</th><th>健康度</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="empty"><strong>还没有同步项目</strong>下一步接入 Wekan 后，这里会自动形成项目清单，不需要重复录入。</div>
  </section>
</main></div></body></html>
