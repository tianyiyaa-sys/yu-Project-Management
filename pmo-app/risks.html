<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>风险中心 - 雨诺项目工作台</title>
<style>
:root{--panel:#fff;--line:#e9ebef;--text:#17191d;--muted:#777d87;--muted2:#9aa0aa;--accent:#4b6bfb;--soft:#eef2ff;--success:#2e9b73;--warning:#d79a2b;--danger:#d85b5b;--shadow:0 10px 30px rgba(31,35,41,.055);--radius:18px}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#fafafa 0%,#f5f6f8 100%);color:var(--text)}
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
.sidebar{background:rgba(250,250,250,.92);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px 26px}
.brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#5c76ff,#7f93ff);color:#fff;font-weight:800;box-shadow:0 8px 20px rgba(75,107,251,.22)}
.brand-text strong{display:block;font-size:14px}.brand-text span{display:block;color:var(--muted2);font-size:11px;margin-top:2px}
.nav-title{padding:0 12px 8px;color:#a4a9b2;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;color:#5d636d;text-decoration:none;padding:10px 12px;border-radius:11px;margin:3px 0;font-size:13px;font-weight:550}
.nav a:hover{background:#f0f1f3;color:#24272c}.nav a.active{background:#fff;color:#1f2430;box-shadow:0 6px 16px rgba(31,35,41,.05);border:1px solid #eceef2}
.nav-icon{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:#f0f2f5;color:#7d8490;font-size:12px}.nav a.active .nav-icon{background:var(--soft);color:var(--accent)}
main{padding:28px 32px 44px;min-width:0}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.eyebrow{color:#9a9fa8;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
h1{font-size:28px;margin:0;letter-spacing:-.03em}.subtitle{color:var(--muted);font-size:13px;margin-top:8px}
.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#fff;color:#353942;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:650;text-decoration:none;cursor:pointer}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.metric{padding:18px 20px;border-right:1px solid var(--line)}.metric:last-child{border-right:none}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:26px;margin-top:10px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.panel-title{font-size:14px;font-weight:750}.panel-sub{font-size:11px;color:var(--muted2);margin-top:4px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.search{flex:1;min-width:240px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;background:#fff}
.select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;background:#fff;color:#555d68}
table{width:100%;border-collapse:collapse;min-width:880px}th{text-align:left;padding:10px 8px;font-size:10px;color:#9ba1aa;border-bottom:1px solid var(--line)}td{padding:14px 8px;border-bottom:1px solid #f0f1f3;font-size:12px;color:#4f5560}
.risk-title{font-weight:700;color:#20242b}.project-link{color:#4b6bfb;text-decoration:none;font-weight:650}.project-link:hover{text-decoration:underline}
.pill{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:10px}.high{background:#fff0f0;color:#c44d4d}.mid{background:#fff8e8;color:#a9791b}.low{background:#eef7f3;color:#277a5d}.status{background:#f1f3f5;color:#6f7680}
.empty{padding:42px 12px;text-align:center;color:#9ba1aa;font-size:12px}.empty strong{display:block;color:#4d535c;font-size:14px;margin-bottom:8px}
@media(max-width:1000px){.metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}.nav{display:flex;gap:4px;overflow:auto}.nav-title{display:none}.nav a{white-space:nowrap}main{padding:20px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">Y</div>
    <div class="brand-text"><strong>雨诺项目工作台</strong><span>PMO Operating Console</span></div>
  </div>
  <div class="nav-title">Workspace</div>
  <nav class="nav">
    <a href="index.html"><span class="nav-icon">⌂</span>PMO 首页</a>
    <a href="projects.html"><span class="nav-icon">项</span>项目中心</a>
    <a class="active" href="risks.html"><span class="nav-icon">险</span>风险中心</a>
    <a href="#"><span class="nav-icon">资</span>资产中心</a>
    <a href="#"><span class="nav-icon">析</span>分析中心</a>
    <a href="#"><span class="nav-icon">AI</span>小雨助手</a>
  </nav>
</aside>

<main>
  <div class="topbar">
    <div>
      <div class="eyebrow">Risk Center</div>
      <h1>风险中心</h1>
      <div class="subtitle">集中查看所有项目的风险、责任人、处理状态与优先级。</div>
    </div>
    <div class="actions"><a class="btn" href="projects.html">返回项目中心</a></div>
  </div>

  <section class="metrics">
    <div class="metric"><span>全部风险</span><strong id="allCount">0</strong></div>
    <div class="metric"><span>高风险</span><strong id="highCount">0</strong></div>
    <div class="metric"><span>处理中</span><strong id="handlingCount">0</strong></div>
    <div class="metric"><span>已关闭</span><strong id="closedCount">0</strong></div>
  </section>

  <section class="panel">
    <div class="panel-title">风险清单</div>
    <div class="panel-sub">风险来源于各项目“风险问题”页；数据统一保存在 PMO 项目数据库。</div>

    <div class="toolbar">
      <input class="search" id="searchInput" placeholder="搜索风险标题 / 项目 / 责任人">
      <select class="select" id="projectFilter"><option value="">全部项目</option></select>
      <select class="select" id="levelFilter"><option value="">全部等级</option><option value="high">高风险</option><option value="mid">中风险</option><option value="low">低风险</option></select>
      <select class="select" id="statusFilter"><option value="">全部状态</option><option value="open">待处理</option><option value="handling">处理中</option><option value="closed">已关闭</option></select>
    </div>

    <div style="overflow:auto">
      <table>
        <thead><tr><th>风险 / 问题</th><th>项目</th><th>等级</th><th>责任人</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody id="riskRows"></tbody>
      </table>
    </div>

    <div class="empty" id="emptyState"><strong>还没有风险数据</strong>请先在具体项目的“风险问题”页新增真实风险。</div>
  </section>
</main>
</div>

<script>
let allRisks=[];

function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]))}
function fmtDate(v){if(!v)return '--';const d=new Date(v);if(Number.isNaN(d.getTime()))return '--';return d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function riskLevelText(v){return v==='high'?'高风险':v==='mid'?'中风险':'低风险'}
function riskLevelClass(v){return v==='high'?'high':v==='mid'?'mid':'low'}
function riskStatusText(v){return v==='closed'?'已关闭':v==='handling'?'处理中':'待处理'}

function populateProjectFilter(){
  const f=document.getElementById('projectFilter');
  const current=f.value;
  const projects=[...new Set(allRisks.map(r=>r.project_name))].filter(Boolean).sort();
  f.innerHTML='<option value="">全部项目</option>'+projects.map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join('');
  f.value=current;
}

function render(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const pf=document.getElementById('projectFilter').value;
  const lf=document.getElementById('levelFilter').value;
  const sf=document.getElementById('statusFilter').value;

  const filtered=allRisks.filter(r=>{
    const blob=((r.title||'')+' '+(r.project_name||'')+' '+(r.owner||'')).toLowerCase();
    return (!q||blob.includes(q))&&(!pf||r.project_name===pf)&&(!lf||r.level===lf)&&(!sf||r.status===sf);
  });

  document.getElementById('allCount').textContent=allRisks.length;
  document.getElementById('highCount').textContent=allRisks.filter(r=>r.level==='high'&&r.status!=='closed').length;
  document.getElementById('handlingCount').textContent=allRisks.filter(r=>r.status==='handling').length;
  document.getElementById('closedCount').textContent=allRisks.filter(r=>r.status==='closed').length;

  document.getElementById('riskRows').innerHTML=filtered.map(r=>{
    const url='project.html?projectId='+encodeURIComponent(r.project_id)+
      '&boardId='+encodeURIComponent(r.wekan_board_id||'')+
      '&title='+encodeURIComponent(r.project_name||'未知项目')+'&tab=risks';
    return '<tr>'+
      '<td class="risk-title">'+esc(r.title||'未命名风险')+'</td>'+
      '<td><a class="project-link" href="'+url+'">'+esc(r.project_name||'未知项目')+'</a></td>'+
      '<td><span class="pill '+riskLevelClass(r.level)+'">'+riskLevelText(r.level)+'</span></td>'+
      '<td>'+esc(r.owner||'未设置')+'</td>'+
      '<td><span class="pill status">'+riskStatusText(r.status)+'</span></td>'+
      '<td>'+fmtDate(r.created_at)+'</td>'+
      '<td><a class="project-link" href="'+url+'">进入项目处理</a></td>'+
    '</tr>';
  }).join('');

  const empty=document.getElementById('emptyState');
  empty.style.display=filtered.length?'none':'';
  if(!allRisks.length){
    empty.innerHTML='<strong>还没有风险数据</strong>请先在具体项目的“风险问题”页新增真实风险。';
  }else if(!filtered.length){
    empty.innerHTML='<strong>没有符合筛选条件的风险</strong>请调整筛选条件。';
  }
}

['searchInput','projectFilter','levelFilter','statusFilter'].forEach(id=>{
  document.getElementById(id).addEventListener(id==='searchInput'?'input':'change',render);
});

(async function init(){
  try{
    const res=await fetch('/api/risks');
    if(!res.ok) throw new Error('HTTP '+res.status);
    allRisks=await res.json();
  }catch(e){
    allRisks=[];
    document.getElementById('emptyState').innerHTML='<strong>PMO 数据库暂时不可用</strong>请稍后刷新。';
  }
  populateProjectFilter();
  render();
})();
</script>
</body>
</html>
